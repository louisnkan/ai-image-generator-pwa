<!-- index.html  (put icon.png, 512x512, in the same folder) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Vision</title>
  <meta name="description" content="AI Vision: a pocket image generator." />
  <meta name="theme-color" content="#0A0A0B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Vision" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0A0A0B;
      --surface: #101014;
      --surface-2: #14141a;
      --text: #ECECF1;
      --muted: #7C7C8A;
      --accent: #8B5CF6;
      --accent-2: #F43F5E;
      --border: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      background:
        radial-gradient(520px 260px at 85% -40px, rgba(139, 92, 246, 0.14), transparent 70%),
        radial-gradient(420px 240px at -10% 18%, rgba(244, 63, 94, 0.07), transparent 70%),
        var(--bg);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 18px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 22px rgba(139, 92, 246, 0.45);
      display: grid;
      place-items: center;
    }
    .logo svg { width: 18px; height: 18px; }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }
    h1 span {
      background: linear-gradient(90deg, #C4B5FD, #FDA4AF);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 6px 0 10px;
    }

    .field {
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(145deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .field:focus-within {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.10), 0 0 30px rgba(139, 92, 246, 0.22);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      border-radius: 17px;
      padding: 16px 18px;
      font: inherit;
      font-size: 16px;
      line-height: 1.55;
      color: var(--text);
      background: var(--surface);
      box-shadow: inset 6px 6px 14px rgba(0,0,0,0.55), inset -3px -3px 10px rgba(255,255,255,0.025);
    }
    textarea::placeholder { color: #4D4D58; }

    .field.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    #generateBtn {
      position: relative;
      width: 100%;
      margin-top: 16px;
      padding: 17px 20px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent) 0%, #C026D3 55%, var(--accent-2) 100%);
      box-shadow:
        0 10px 30px rgba(139, 92, 246, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 -6px 14px rgba(0, 0, 0, 0.25) inset;
      transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.25s ease;
    }
    #generateBtn:active { transform: scale(0.985); }
    #generateBtn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset; }

    .display-wrap { margin-top: 26px; }

    .display {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        inset 8px 8px 18px rgba(0,0,0,0.5),
        inset -4px -4px 12px rgba(255,255,255,0.02),
        0 20px 50px rgba(0,0,0,0.5);
    }

    .placeholder, .loader, .error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .display[data-state="idle"] .placeholder,
    .display[data-state="loading"] .loader,
    .display[data-state="error"] .error { display: flex; }

    .placeholder svg { width: 44px; height: 44px; opacity: 0.35; }
    .placeholder p, .error p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; max-width: 240px; }
    .error p { color: #FDA4AF; }

    .spinner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 25%, var(--accent), var(--accent-2));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      animation: spin 0.9s linear infinite;
      filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.6));
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.4; } }

    #result {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .display[data-state="done"] #result { opacity: 1; }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #46464F;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
            <path d="M19 16l.7 2.1L22 19l-2.3.9L19 22l-.7-2.1L16 19l2.3-.9L19 16z"/>
          </svg>
        </div>
        <h1>AI <span>Vision</span></h1>
      </div>
      <div class="badge">1024 × 1024</div>
    </header>

    <main>
      <label for="prompt">Your prompt</label>
      <div class="field" id="field">
        <textarea id="prompt" placeholder="A lone astronaut standing in a neon-lit rainforest, cinematic lighting, ultra detailed..." rows="5" autocomplete="off" spellcheck="true"></textarea>
      </div>

      <button id="generateBtn" type="button">Generate Image</button>

      <div class="display-wrap">
        <div class="display" id="display" data-state="idle">
          <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="9" cy="9" r="1.8"/>
              <path d="M21 16l-5-5-8 8"/>
            </svg>
            <p>Your creation will appear here.</p>
          </div>

          <div class="loader" role="status" aria-live="polite">
            <div class="spinner"></div>
            <div class="loading-text">Loading...</div>
          </div>

          <div class="error" role="alert">
            <p id="errorMsg">Something went wrong. Please try again.</p>
          </div>

          <img id="result" alt="Generated image" decoding="async" />
        </div>
      </div>

      <footer>AI Vision</footer>
    </main>
  </div>

  <script>
    (function () {
      var promptEl = document.getElementById('prompt');
      var btn = document.getElementById('generateBtn');
      var display = document.getElementById('display');
      var img = document.getElementById('result');
      var field = document.getElementById('field');
      var errorMsg = document.getElementById('errorMsg');
      var requestId = 0;

      function setState(state) {
        display.setAttribute('data-state', state);
      }

      function finish() {
        btn.disabled = false;
        btn.textContent = 'Generate Image';
      }

      function generate() {
        var text = promptEl.value.trim();

        if (!text) {
          field.classList.remove('shake');
          void field.offsetWidth;
          field.classList.add('shake');
          promptEl.focus();
          return;
        }

        if (!navigator.onLine) {
          errorMsg.textContent = 'You appear to be offline. Connect to the internet to generate images.';
          setState('error');
          return;
        }

        var encodedPrompt = encodeURIComponent(text);
        var url = 'https://gen.pollinations.ai/image/' + encodedPrompt + '?width=1024&height=1024&nologo=true';

        var myId = ++requestId;
        btn.disabled = true;
        btn.textContent = 'Generating...';
        setState('loading');
        promptEl.blur();

        img.onload = function () {
          if (myId !== requestId) return;
          setState('done');
          finish();
        };
        img.onerror = function () {
          if (myId !== requestId) return;
          errorMsg.textContent = 'The image could not be loaded. Check your connection and try again.';
          setState('error');
          finish();
        };

        img.src = url;
      }

      btn.addEventListener('click', generate);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    })();
  </script>
</body>
  </html>
